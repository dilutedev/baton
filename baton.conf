# baton configuration: per-role model/effort, plus the window layout.
#
# Resolution order per role, most specific wins:
#   <project>/.baton/config  ->  <role>.<key>
#   <project>/.baton/config  ->  default.<key>
#   ~/.baton/baton.conf (or $BATON_CONF) -> <role>.<key>
#   ~/.baton/baton.conf (or $BATON_CONF) -> default.<key>
#   built-in fallback: model=sonnet, effort=high
#
# Roles: conductor, researcher, planner, principal, implementer, reviewer
# model:  an alias (sonnet, opus, fable) or a full model name
# effort: low, medium, high, xhigh, max
#
# `layout` is not per-role (it's a window-level tmux setting, so it has no
# <role>. prefix). One of:
#   tiled           equal grid, all 6 panes the same size (default)
#   main-vertical   conductor gets a large pane on the left, the rest sit
#                   in a narrow column on the right
#   main-horizontal conductor gets a large pane on top, the rest sit in a
#                   short row underneath
# Whatever the layout, tmux's pane zoom (prefix + z) always toggles the
# focused pane to fullscreen and back - reach for that first if you just
# want to read one pane without changing the layout for everyone.
#
# Check what a directory would actually launch with: baton config [DIR]

default.model=sonnet
default.effort=high

# Judgment-critical roles: nothing downstream double-checks their output,
# so they stay on Claude at the best model for the job.
planner.model=sonnet
planner.effort=medium

principal.model=opus
principal.effort=medium

reviewer.model=opus
reviewer.effort=medium

# Execution/mechanical roles: cheaper z.ai GLM models, since mistakes here
# either get caught by the reviewer or don't require deep judgment.
# Requires ANTHROPIC_BASE_URL/ANTHROPIC_AUTH_TOKEN wired per-pane for these
# roles in bin/baton - not yet implemented, see README.
conductor.model=glm-5.3-flash
conductor.effort=medium

researcher.model=glm-5.3

implementer.model=glm-5.3
implementer.effort=medium

layout=tiled
