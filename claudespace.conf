# claudespace configuration: per-role model/effort, plus the window layout.
#
# Resolution order per role, most specific wins:
#   <project>/.claudespace/config  ->  <role>.<key>
#   <project>/.claudespace/config  ->  default.<key>
#   ~/.claudespace/claudespace.conf (or $CLAUDESPACE_CONF) -> <role>.<key>
#   ~/.claudespace/claudespace.conf (or $CLAUDESPACE_CONF) -> default.<key>
#   built-in fallback: model=sonnet, effort=high
#
# Roles: conductor, researcher, planner, principal, implementer, reviewer
# model:  an alias (sonnet, opus, fable) or a full model name
# effort: low, medium, high, xhigh, max
#
# `layout` is not per-role (it's a window-level tmux setting, so it has no
# <role>. prefix). One of:
#   tiled           equal grid, all 6 panes the same size (default)
#   main-vertical   conductor gets a large pane on the left, the rest sit
#                   in a narrow column on the right
#   main-horizontal conductor gets a large pane on top, the rest sit in a
#                   short row underneath
# Whatever the layout, tmux's pane zoom (prefix + z) always toggles the
# focused pane to fullscreen and back - reach for that first if you just
# want to read one pane without changing the layout for everyone.
#
# Check what a directory would actually launch with: claudespace config [DIR]

default.model=sonnet
default.effort=high

conductor.effort=medium

implementer.effort=medium

layout=tiled
